<style>

<script>
var BOOK_URL = 'https://m.booking.naver.com/booking/10/bizes/1603452/items/7482030?theme=place&lang=ko';
// 자체 방문 기록(/t.js → 운영웹 '웹 방문'). 이름·전화 등 입력값은 보내지 않는다.
function ot(n, l){ if (!n) return; try { if (window.odiTrack) window.odiTrack(n, l); } catch(err) {} }

document.querySelectorAll('[data-book]').forEach(function(el){
  el.addEventListener('click', function(e){
    e.preventDefault();
    try { fbq('track', 'Schedule', {content_name: 'naver_booking'}); } catch(err) {}
    try { window.karrotPixel.track('Lead'); } catch(err) {}
    ot('naver_click', 'main');
    setTimeout(openNaver, 250);
  });
});
document.querySelector('[data-home]').addEventListener('click', function(){ ot('home_click'); });

/* 인스타 인앱브라우저는 네이버 로그인이 막히므로 앱으로 먼저 보낸다 */
function openNaver(){
  var ua = navigator.userAgent || "", enc = encodeURIComponent(BOOK_URL), deep = null;
  if (/Android/i.test(ua)) deep = "intent://inappbrowser?url=" + enc + "&target=new&version=6#Intent;scheme=naversearchapp;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.search;S.browser_fallback_url=" + enc + ";end";
  else if (/iPhone|iPad|iPod/i.test(ua)) deep = "naversearchapp://inappbrowser?url=" + enc + "&target=new&version=6";
  if (!deep) { window.location.href = BOOK_URL; return; }
  var left = false, gone = function(){ if (!left) { left = true; try { fbq("trackCustom", "NaverAppOpened"); } catch(err) {} } };
  document.addEventListener("visibilitychange", function(){ if (document.hidden) gone(); });
  window.addEventListener("pagehide", gone); window.addEventListener("blur", gone);
  setTimeout(function(){
    if (!left && !document.hidden) {
      left = true;
      try { fbq("trackCustom", "NaverWebFallback"); } catch(err) {}
      markFallback();
      setTimeout(function(){ window.location.href = BOOK_URL; }, 150);
    }
  }, 2000);
  window.location.href = deep;
}

/* 문자 보조 경로: 앱이 안 열려 웹으로 떨어진 사람이 로그인 벽에서 돌아왔을 때만 펼친다.
   (10/5 보강 그대로 — pageshow 만으로는 인앱브라우저 복귀를 못 잡아 visibility·focus 도 본다) */
var fellBack = false, leftOnce = false;
function markFallback(){ fellBack = true; try { sessionStorage.setItem('odi_naver_fallback','1'); } catch(e) {} }
function fallbackPending(){
  if (fellBack) return true;
  try { return sessionStorage.getItem('odi_naver_fallback') === '1'; } catch(e) { return false; }
}
function showFallbackHelp(){
  if (!fallbackPending()) return;
  var box = document.getElementById('smsfall');
  if (!box || box.classList.contains('on')) return;
  box.classList.add('on');
  try { fbq('trackCustom', 'SmsFallbackShown'); } catch(err) {}
  try { box.scrollIntoView({behavior:'smooth', block:'center'}); } catch(e) {}
}
window.addEventListener('pageshow', showFallbackHelp);
document.addEventListener('DOMContentLoaded', showFallbackHelp);
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { leftOnce = true; return; }
  if (leftOnce) showFallbackHelp();
});
window.addEventListener('focus', function(){ if (leftOnce) showFallbackHelp(); });
window.addEventListener('blur', function(){ leftOnce = true; });
document.querySelector('[data-smsfall]').addEventListener('click', function(){
  try { fbq('trackCustom','SmsFallbackClick'); } catch(err) {}
  try { window.karrotPixel.track('Lead'); } catch(err) {}
});
</script>
